<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>PED SAN | لوحة الإدارة</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;display:flex;
  align-items:center;justify-content:center;
  background:linear-gradient(145deg,#050505,#260707,#080808);
  color:#fff;font-family:Arial,sans-serif
}
.card{
  width:100%;max-width:450px;padding:25px;
  background:rgba(18,18,18,.96);border:1px solid #492020;
  border-radius:22px;box-shadow:0 10px 40px #0009
}
.logo{text-align:center;font-size:30px;font-weight:bold;color:#ff3333;letter-spacing:2px}
.subtitle{text-align:center;color:#aaa;margin:8px 0 25px}
label{display:block;margin-top:15px;color:#ddd;font-size:14px}
input,textarea{
  width:100%;margin-top:8px;padding:14px;color:#fff;
  background:#191919;border:1px solid #3b3b3b;border-radius:12px;
  outline:none;font-size:15px;font-family:inherit
}
textarea{min-height:120px;resize:vertical;line-height:1.7}
button{
  width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;
  background:linear-gradient(90deg,#a60000,#f22);color:white;
  font-size:16px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#292929}
.green{background:linear-gradient(90deg,#08752b,#21c45b)}
.hidden{display:none!important}
.status{
  margin-top:18px;padding:12px;background:#202020;border-radius:10px;
  color:#ddd;font-size:13px;line-height:1.8;overflow-wrap:anywhere
}
.section{
  margin-top:22px;padding:16px;background:#111;
  border:1px solid #3b2424;border-radius:16px
}
.section h3{margin:0 0 8px;color:#ff5555;font-size:18px}
.desc{font-size:13px;color:#aaa;line-height:1.8}
.state{font-weight:bold;margin-top:12px}
.hint{margin-top:18px;color:#888;text-align:center;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">PED SAN</div>
  <div class="subtitle">لوحة إدارة الرسائل والتحكم</div>

  <div id="loginBox">
    <label for="email">البريد الإلكتروني للمدير</label>
    <input id="email" type="email" autocomplete="username" placeholder="أدخل البريد الإلكتروني">
    <label for="password">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور">
    <button id="loginBtn">تسجيل الدخول</button>
  </div>

  <div id="adminBox" class="hidden">
    <div class="section">
      <h3>إدارة الرسائل</h3>
      <label for="title">عنوان الرسالة</label>
      <input id="title" maxlength="100" value="يوجد تحديث">
      <label for="message">محتوى الرسالة</label>
      <textarea id="message" maxlength="5000" placeholder="اكتب الرسالة هنا..."></textarea>
      <button id="sendBtn">إرسال الرسالة</button>
    </div>

    <div class="section">
      <h3>التحكم في زر تسجيل الدخول</h3>
      <div class="desc">
        يمكنك إيقاف أو تشغيل button1 في تطبيق PED SAN لجميع المستخدمين المتصلين بالإنترنت.
      </div>
      <div id="buttonState" class="state">جارٍ جلب حالة الزر...</div>
      <button id="enableBtn" class="green">تشغيل button1</button>
      <button id="disableBtn">إيقاف button1</button>
    </div>

    <button id="logoutBtn" class="secondary">تسجيل الخروج</button>
  </div>

  <div id="status" class="status">جارٍ تجهيز النظام...</div>
  <div class="hint">PED SAN — نظام إدارة التطبيق</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";

var firebaseConfig={
  apiKey:"AIzaSyC393Ko1pqXlXQGP3iyoXau9zDm8JLlQUA",
  authDomain:"ped-37b14.firebaseapp.com",
  databaseURL:"https://ped-37b14-default-rtdb.firebaseio.com",
  projectId:"ped-37b14",
  storageBucket:"ped-37b14.firebasestorage.app",
  messagingSenderId:"816967461547",
  appId:"1:816967461547:web:a08a820772b3212f6b65ee",
  measurementId:"G-60WPS80C8Q"
};

function el(id){return document.getElementById(id)}
function status(msg){el("status").textContent=msg}

if(!window.firebase){
  status("تعذر تحميل Firebase. تحقق من الإنترنت.");
  return;
}

try{
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
}catch(e){
  status("خطأ في تهيئة Firebase: "+e.message);
  return;
}

var auth=firebase.auth();
var db=firebase.database();
var buttonRef=db.ref("settings/button1_enabled");
var sending=false;
var changing=false;
var buttonListener=null;

auth.onAuthStateChanged(function(user){
  if(user){
    el("loginBox").classList.add("hidden");
    el("adminBox").classList.remove("hidden");
    status("تم تسجيل الدخول. جارٍ تحميل حالة button1...");
    listenButtonState();
  }else{
    el("loginBox").classList.remove("hidden");
    el("adminBox").classList.add("hidden");
    stopButtonListener();
    status("سجّل الدخول بحساب المدير للمتابعة.");
  }
});

function listenButtonState(){
  stopButtonListener();

  buttonListener=function(snapshot){
    var value=snapshot.val();

    if(typeof value!=="boolean"){
      el("buttonState").textContent=
        "لم تُضبط الحالة بعد. شغّل الزر لإنشاء الإعداد.";
      return;
    }

    el("buttonState").textContent=value
      ?"حالة الزر: يعمل الآن"
      :"حالة الزر: متوقف";

    el("enableBtn").disabled=value||changing;
    el("disableBtn").disabled=!value||changing;
  };

  buttonRef.on("value",buttonListener,function(error){
    el("buttonState").textContent="تعذر قراءة الحالة: "+error.message;
  });
}

function stopButtonListener(){
  if(buttonListener){
    buttonRef.off("value",buttonListener);
    buttonListener=null;
  }
}

function setButtonEnabled(enabled){
  if(changing)return;

  if(!auth.currentUser){
    status("سجّل الدخول أولاً.");
    return;
  }

  changing=true;
  el("enableBtn").disabled=true;
  el("disableBtn").disabled=true;
  status(enabled?"جارٍ تشغيل button1...":"جارٍ إيقاف button1...");

  buttonRef.set(enabled)
    .then(function(){
      status(enabled
        ?"تم تشغيل button1 وحفظ الحالة في Firebase."
        :"تم إيقاف button1 وحفظ الحالة في Firebase.");
    })
    .catch(function(error){
      status("فشل تغيير حالة الزر: "+error.message);
    })
    .then(function(){
      changing=false;
      el("enableBtn").disabled=false;
      el("disableBtn").disabled=false;
    });
}

el("loginBtn").onclick=function(){
  var email=el("email").value.trim();
  var password=el("password").value;

  if(!email||!password){
    status("أدخل البريد الإلكتروني وكلمة المرور.");
    return;
  }

  el("loginBtn").disabled=true;
  status("جارٍ تسجيل الدخول...");

  auth.signInWithEmailAndPassword(email,password)
    .then(function(){
      el("password").value="";
      status("تم تسجيل الدخول بنجاح.");
    })
    .catch(function(error){
      status("فشل تسجيل الدخول: "+error.message);
    })
    .then(function(){
      el("loginBtn").disabled=false;
    });
};

el("sendBtn").onclick=function(){
  if(sending)return;

  var user=auth.currentUser;
  var title=el("title").value.trim();
  var message=el("message").value.trim();

  if(!user){
    status("سجّل الدخول مرة أخرى.");
    return;
  }
  if(!title||!message){
    status("اكتب عنوان الرسالة ومحتواها.");
    return;
  }

  sending=true;
  el("sendBtn").disabled=true;
  status("جارٍ حفظ الرسالة...");

  db.ref("messages").push({
    title:title,
    message:message,
    createdAt:firebase.database.ServerValue.TIMESTAMP
  })
  .then(function(){
    el("message").value="";
    status("تم إرسال الرسالة بنجاح.");
  })
  .catch(function(error){
    status("تعذر الإرسال: "+error.message);
  })
  .then(function(){
    sending=false;
    el("sendBtn").disabled=false;
  });
};

el("enableBtn").onclick=function(){setButtonEnabled(true)};
el("disableBtn").onclick=function(){setButtonEnabled(false)};

el("logoutBtn").onclick=function(){
  auth.signOut()
    .then(function(){status("تم تسجيل الخروج.");})
    .catch(function(error){status("تعذر تسجيل الخروج: "+error.message);});
};
})();
</script>
</body>
</html>
