<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocialX</title>

<style>
*{box-sizing:border-box;margin:0}
body{
font-family:Arial,sans-serif;
background:#080b12;color:#fff
}
button,input{font-family:inherit}

.login{
height:100vh;display:grid;place-items:center;padding:20px
}

.box{
width:100%;max-width:390px;
background:#111722;
border:1px solid #242d3d;
border-radius:28px;
padding:35px 25px;
text-align:center;
box-shadow:0 20px 70px #0008
}

.logo{
font-size:38px;font-weight:bold;
margin-bottom:8px
}

.sub{
color:#8993a5;
margin-bottom:30px
}

.google{
width:100%;padding:15px;
border:0;border-radius:15px;
background:white;color:#111;
font-size:16px;font-weight:bold;
cursor:pointer
}

.app{display:none;min-height:100vh}

.top{
height:70px;padding:10px 18px;
display:flex;align-items:center;
justify-content:space-between;
border-bottom:1px solid #202938;
background:#0c1018
}

.me{
display:flex;align-items:center;gap:10px
}

.avatar{
width:43px;height:43px;
border-radius:50%;
object-fit:cover;
background:#222
}

.logout{
border:0;background:#191f2b;
color:#fff;padding:10px 14px;
border-radius:12px;cursor:pointer
}

.content{
max-width:900px;
margin:auto;padding:20px
}

.search{
width:100%;
padding:15px 18px;
border-radius:16px;
border:1px solid #273142;
background:#111722;
color:#fff;
outline:none;
margin-bottom:18px
}

.section{
font-size:20px;
font-weight:bold;
margin-bottom:14px
}

.person{
display:flex;
align-items:center;
justify-content:space-between;
background:#111722;
border:1px solid #202938;
padding:13px;
border-radius:18px;
margin-bottom:10px
}

.personInfo{
display:flex;
align-items:center;
gap:10px
}

.chatBtn{
border:0;
background:#2563eb;
color:white;
padding:9px 14px;
border-radius:12px;
cursor:pointer
}

.chat{
display:none;
position:fixed;
inset:0;
background:#080b12;
z-index:10;
flex-direction:column
}

.chatTop{
height:70px;
display:flex;
align-items:center;
gap:12px;
padding:10px 15px;
border-bottom:1px solid #202938
}

.back{
border:0;
background:#191f2b;
color:#fff;
padding:9px 13px;
border-radius:12px;
cursor:pointer
}

.msgs{
flex:1;
overflow:auto;
padding:20px
}

.msg{
max-width:75%;
width:max-content;
padding:11px 15px;
border-radius:18px;
background:#182130;
margin:8px 0
}

.mine{
margin-right:auto;
background:#2563eb
}

.send{
display:flex;
gap:8px;
padding:12px;
border-top:1px solid #202938
}

.send input{
flex:1;
padding:14px;
border:0;
outline:none;
border-radius:15px;
background:#111722;
color:#fff
}

.send button{
border:0;
padding:0 20px;
border-radius:15px;
background:#2563eb;
color:white
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login" id="login">

<div class="box">

<div class="logo">SocialX</div>

<div class="sub">
تواصل • تحدث • شارك
</div>

<button class="google" onclick="login()">
🔐 الدخول بحساب Google
</button>

</div>

</div>


<!-- APP -->

<div class="app" id="app">

<header class="top">

<div class="me">

<img class="avatar" id="myPhoto">

<b id="myName">أنت</b>

</div>

<button class="logout" onclick="logout()">
خروج
</button>

</header>


<main class="content">

<input
class="search"
id="search"
placeholder="🔎 ابحث عن شخص..."
oninput="searchUsers()"
>

<div class="section">
الأشخاص
</div>

<div id="people"></div>

</main>

</div>


<!-- CHAT -->

<div class="chat" id="chat">

<div class="chatTop">

<button class="back" onclick="closeChat()">
رجوع
</button>

<img class="avatar" id="chatPhoto">

<b id="chatName"></b>

</div>


<div class="msgs" id="msgs"></div>


<div class="send">

<input
id="message"
placeholder="اكتب رسالة..."
onkeydown="enterSend(event)"
>

<button onclick="send()">
إرسال
</button>

</div>

</div>


<script>

let currentUser=null;
let currentPerson=null;


/* مستخدمين تجريبيين */

const users=[

{
id:1,
name:"محمد",
photo:"https://i.pravatar.cc/100?img=12"
},

{
id:2,
name:"أحمد",
photo:"https://i.pravatar.cc/100?img=32"
},

{
id:3,
name:"سارة",
photo:"https://i.pravatar.cc/100?img=47"
},

{
id:4,
name:"نور",
photo:"https://i.pravatar.cc/100?img=44"
}

];


/* تسجيل الدخول التجريبي */

function login(){

currentUser={
name:"مستخدم SocialX",
photo:"https://i.pravatar.cc/100?img=68"
};

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

document.getElementById("myName").textContent=
currentUser.name;

document.getElementById("myPhoto").src=
currentUser.photo;

showUsers();

}


/* خروج */

function logout(){

currentUser=null;

document.getElementById("app").style.display="none";
document.getElementById("login").style.display="grid";

}


/* عرض المستخدمين */

function showUsers(list=users){

const box=document.getElementById("people");

box.innerHTML="";

list.forEach(u=>{

box.innerHTML+=`

<div class="person">

<div class="personInfo">

<img class="avatar" src="${u.photo}">

<b>${u.name}</b>

</div>

<button
class="chatBtn"
onclick="openChat(${u.id})">
دردشة
</button>

</div>

`;

});

}


/* البحث */

function searchUsers(){

const q=
document.getElementById("search")
.value
.toLowerCase();

const result=
users.filter(u=>
u.name.toLowerCase().includes(q)
);

showUsers(result);

}


/* فتح الدردشة */

function openChat(id){

currentPerson=
users.find(u=>u.id===id);

document.getElementById("chat")
.style.display="flex";

document.getElementById("chatName")
.textContent=currentPerson.name;

document.getElementById("chatPhoto")
.src=currentPerson.photo;

loadMessages();

}


/* الرسائل */

function key(){

return "chat_"+currentPerson.id;

}


function loadMessages(){

const box=document.getElementById("msgs");

box.innerHTML="";

const data=
JSON.parse(localStorage.getItem(key())||"[]");

data.forEach(m=>{

const div=document.createElement("div");

div.className=
"msg "+(m.me?"mine":"");

div.textContent=m.text;

box.appendChild(div);

});

box.scrollTop=box.scrollHeight;

}


/* إرسال */

function send(){

const input=
document.getElementById("message");

const text=input.value.trim();

if(!text)return;

const data=
JSON.parse(localStorage.getItem(key())||"[]");

data.push({
text:text,
me:true
});

localStorage.setItem(
key(),
JSON.stringify(data)
);

input.value="";

loadMessages();

}


/* Enter */

function enterSend(e){

if(e.key==="Enter"){
send();
}

}


/* إغلاق */

function closeChat(){

document.getElementById("chat")
.style.display="none";

currentPerson=null;

}


/* تشغيل */

showUsers();

</script>

</body>
</html>
