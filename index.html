
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>PED SAN | إدارة الرسائل</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #050505, #260707, #080808);
  color: #fff;
  font-family: Arial, sans-serif;
}

.card {
  width: 100%;
  max-width: 450px;
  padding: 25px;
  background: rgba(18, 18, 18, 0.96);
  border: 1px solid #492020;
  border-radius: 22px;
  box-shadow: 0 10px 40px #0009;
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  color: #ff3333;
  letter-spacing: 2px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 15px;
  color: #ddd;
  font-size: 14px;
}

input, textarea {
  width: 100%;
  margin-top: 8px;
  padding: 14px;
  color: #fff;
  background: #191919;
  border: 1px solid #3b3b3b;
  border-radius: 12px;
  outline: none;
  font-size: 15px;
  font-family: inherit;
}

input:focus, textarea:focus {
  border-color: #e32636;
}

textarea {
  min-height: 140px;
  resize: vertical;
  line-height: 1.7;
}

button {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, #a60000, #f22);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.secondary {
  background: #292929;
}

.hidden {
  display: none !important;
}

.status {
  margin-top: 18px;
  padding: 12px;
  background: #202020;
  border-radius: 10px;
  color: #ddd;
  font-size: 13px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.hint {
  margin-top: 18px;
  color: #888;
  text-align: center;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">PED SAN</div>
  <div class="subtitle">لوحة إدارة الرسائل</div>

  <div id="loginBox">

    <label for="email">البريد الإلكتروني للمدير</label>
    <input
      id="email"
      type="email"
      autocomplete="username"
      placeholder="أدخل البريد الإلكتروني">

    <label for="password">كلمة المرور</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="أدخل كلمة المرور">

    <button id="loginBtn">تسجيل الدخول</button>

  </div>

  <div id="sendBox" class="hidden">

    <label for="title">عنوان الرسالة</label>
    <input
      id="title"
      type="text"
      maxlength="100"
      value="يوجد تحديث">

    <label for="message">محتوى الرسالة</label>
    <textarea
      id="message"
      maxlength="5000"
      placeholder="اكتب الرسالة هنا..."></textarea>

    <button id="sendBtn">إرسال الرسالة</button>

    <button id="logoutBtn" class="secondary">
      تسجيل الخروج
    </button>

  </div>

  <div id="status" class="status">
    جاهز للاستخدام.
  </div>

  <div class="hint">
    PED SAN — نظام إدارة الرسائل
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyC393Ko1pqXlXQGP3iyoXau9zDm8JLlQUA",
    authDomain: "ped-37b14.firebaseapp.com",
    databaseURL: "https://ped-37b14-default-rtdb.firebaseio.com",
    projectId: "ped-37b14",
    storageBucket: "ped-37b14.firebasestorage.app",
    messagingSenderId: "816967461547",
    appId: "1:816967461547:web:a08a820772b3212f6b65ee",
    measurementId: "G-60WPS80C8Q"
  };

  var loginBox = document.getElementById("loginBox");
  var sendBox = document.getElementById("sendBox");
  var emailInput = document.getElementById("email");
  var passwordInput = document.getElementById("password");
  var titleInput = document.getElementById("title");
  var messageInput = document.getElementById("message");
  var loginBtn = document.getElementById("loginBtn");
  var sendBtn = document.getElementById("sendBtn");
  var logoutBtn = document.getElementById("logoutBtn");
  var statusBox = document.getElementById("status");

  function setStatus(message) {
    statusBox.textContent = message;
  }

  if (!window.firebase) {
    setStatus("تعذر تحميل Firebase. تحقق من اتصال الإنترنت.");
    loginBtn.disabled = true;
    return;
  }

  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
  } catch (error) {
    setStatus("تعذر تهيئة Firebase: " + error.message);
    return;
  }

  var auth = firebase.auth();
  var database = firebase.database();
  var sending = false;

  auth.onAuthStateChanged(function (user) {
    if (user) {
      loginBox.classList.add("hidden");
      sendBox.classList.remove("hidden");
      setStatus("تم تسجيل الدخول. يمكنك إرسال الرسائل.");
    } else {
      loginBox.classList.remove("hidden");
      sendBox.classList.add("hidden");
      setStatus("سجّل الدخول بحساب المدير للمتابعة.");
    }
  });

  loginBtn.onclick = function () {
    var email = emailInput.value.trim();
    var password = passwordInput.value;

    if (!email || !password) {
      setStatus("أدخل البريد الإلكتروني وكلمة المرور.");
      return;
    }

    loginBtn.disabled = true;
    setStatus("جارٍ تسجيل الدخول...");

    auth.signInWithEmailAndPassword(email, password)
      .then(function () {
        passwordInput.value = "";
        setStatus("تم تسجيل الدخول بنجاح.");
      })
      .catch(function (error) {
        setStatus("فشل تسجيل الدخول: " + error.message);
      })
      .then(function () {
        loginBtn.disabled = false;
      });
  };

  sendBtn.onclick = function () {
    if (sending) return;

    var user = auth.currentUser;
    var title = titleInput.value.trim();
    var message = messageInput.value.trim();

    if (!user) {
      setStatus("انتهت جلسة الدخول. سجّل الدخول مرة أخرى.");
      return;
    }

    if (!title || !message) {
      setStatus("اكتب عنوان الرسالة ومحتواها.");
      return;
    }

    if (title.length > 100 || message.length > 5000) {
      setStatus("الرسالة أطول من الحد المسموح.");
      return;
    }

    sending = true;
    sendBtn.disabled = true;
    setStatus("جارٍ حفظ الرسالة في Firebase...");

    database.ref("messages").push({
      title: title,
      message: message,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    })
    .then(function () {
      messageInput.value = "";
      setStatus("تم إرسال الرسالة وحفظها بنجاح.");
    })
    .catch(function (error) {
      setStatus("تعذر الإرسال: " + error.message);
    })
    .then(function () {
      sending = false;
      sendBtn.disabled = false;
    });
  };

  logoutBtn.onclick = function () {
    logoutBtn.disabled = true;

    auth.signOut()
      .then(function () {
        setStatus("تم تسجيل الخروج.");
      })
      .catch(function (error) {
        setStatus("تعذر تسجيل الخروج: " + error.message);
      })
      .then(function () {
        logoutBtn.disabled = false;
      });
  };

})();
</script>

</body>
</html>
